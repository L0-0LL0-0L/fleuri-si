[package]
name = "pollen-staking-integration"
version = "0.1.0"
edition = "2021"
publish = false

# Executes the compiled SBF program in LiteSVM, together with Meteora's real Dynamic Fee
# Sharing bytecode dumped from mainnet. See ../README.md ("Program tests").
#   PS_SO  = path to pollen_staking.so  (default ../target/deploy/pollen_staking.so)
#   DFS_SO = path to dfs.so             (default fixtures/dfs.so)
[dev-dependencies]
litesvm = "0.7"
pollen-staking = { path = "../programs/pollen-staking", features = ["no-entrypoint"] }
anchor-lang = "=0.32.1"
solana-sdk = "2.2"
spl-token = { version = "8", features = ["no-entrypoint"] }
bincode = "1"

[workspace]
