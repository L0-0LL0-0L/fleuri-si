[package]
name = "pollen-staking"
version = "0.1.0"
edition = "2021"
description = "Fleuri Pollen Staking: stake a fixed SPL mint, earn actually collected wSOL fees"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "pollen_staking"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = { version = "=0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "=0.32.1", default-features = false, features = ["token", "token_2022"] }

[lints.rust]
unexpected_cfgs = { level = "allow" }
